<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Ontological prototype of Subjectivity Intersection Ontology</title>
  <desc id="desc">Absolute Subjectivity S projects Relative Subjectivity R. Intersection Subjectivity X emerges in the interval between S and R. All three belong to one triadic ontological self-closure.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#243447"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#245B78"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <rect x="42" y="48" width="1116" height="520" rx="28" fill="none" stroke="#8493A3" stroke-width="2"/>
  <text x="600" y="84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#425466">Triadic ontological self-closure</text>

  <rect x="92" y="162" width="330" height="112" rx="18" fill="#EAF2F7" stroke="#245B78" stroke-width="2.5"/>
  <text x="257" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#173B4E">Absolute Subjectivity</text>
  <text x="257" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#173B4E">S</text>

  <rect x="778" y="162" width="330" height="112" rx="18" fill="#F2F4F6" stroke="#66788A" stroke-width="2.5"/>
  <text x="943" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#2D3B49">Relative Subjectivity</text>
  <text x="943" y="242" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#2D3B49">R</text>

  <line x1="424" y1="218" x2="771" y2="218" stroke="#245B78" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="505" y="179" width="190" height="36" rx="18" fill="#ffffff"/>
  <text x="600" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#245B78">Projection</text>

  <path d="M257 301 C350 355, 465 365, 600 365 C735 365, 850 355, 943 301" fill="none" stroke="#66788A" stroke-width="2.5"/>
  <text x="600" y="347" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#526273">Constitutive intersection</text>
  <line x1="600" y1="369" x2="600" y2="421" stroke="#243447" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="622" y="403" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#526273">emergence</text>

  <rect x="403" y="432" width="394" height="104" rx="18" fill="#E8F3EF" stroke="#2A7563" stroke-width="2.5"/>
  <text x="600" y="474" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#1F594B">Intersection Subjectivity</text>
  <text x="600" y="509" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#1F594B">X</text>
</svg>
